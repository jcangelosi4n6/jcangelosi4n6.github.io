{% if site.listenbrainz.username and site.listenbrainz.username != "" %}
<aside class="nowplaying" id="nowplaying" hidden
       data-user="{{ site.listenbrainz.username | escape }}"
       data-refresh="{{ site.listenbrainz.refresh | default: 60 }}"
       aria-live="polite">
  <a class="np-link" href="https://listenbrainz.org/user/{{ site.listenbrainz.username | uri_escape }}/" rel="noopener">
    <img class="np-art" alt="" width="48" height="48" loading="lazy" hidden>
    <span class="np-art-fallback" aria-hidden="true">♪</span>
    <span class="np-text">
      <span class="np-status">
        <span class="np-bars" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="np-label">Now playing</span>
      </span>
      <span class="np-track"></span>
      <span class="np-artist"></span>
    </span>
  </a>
</aside>
<script src="{{ '/assets/js/nowplaying.js' | relative_url }}" defer></script>
{% endif %}

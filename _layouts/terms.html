---
layout: default
---
<header class="page-head"><h1>{{ page.title }}</h1></header>
{% assign names = "" | split: "" %}{% for t in site.tags %}{% assign names = names | push: t[0] %}{% endfor %}
<ul class="terms">
  {% assign sorted = names | sort_natural %}
  {% for name in sorted %}
  <li><a href="{{ name | slugify | prepend: "/tags/" | append: "/" | relative_url }}">#{{ name }}</a> <span>{{ site.tags[name].size }}</span></li>
  {% endfor %}
</ul>
